[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpre-alns-repro"
version = "1.0.0"
description = "Reproducibility code for learning-assisted risk-aware electric delivery routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Lingchen Liang"},
  {name = "Yue Li"},
  {name = "Feiyu Sun"},
  {name = "Wenhao Yan"},
  {name = "Hengjie Su"},
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
ml = ["torch>=2.0"]
analysis = ["pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
milp = ["gurobipy==12.0.3"]
all = [
  "torch>=2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
tpre-demo = "tpre_alns.cli:demo_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
